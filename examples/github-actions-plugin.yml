name: backend-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BackendTestingStudio.slnx
      - name: Validate plugin
        run: >
          dotnet run --project BackendTestingStudio.Cli -c Release --
          validate --plugin plugins/my-api/plugin.json
      - name: Run smoke
        env:
          BTS_SECRET_MY_API_PASSWORD: ${{ secrets.TEST_API_PASSWORD }}
          BTS_SECRET_MY_API_APIKEY: ${{ secrets.TEST_API_KEY }}
        run: >
          dotnet run --project BackendTestingStudio.Cli -c Release --
          run --plugin plugins/my-api/plugin.json
          --scenario authenticated-smoke --environment staging
          --json artifacts/run.json
          --html artifacts/run.html
          --junit artifacts/run.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-testing-studio-reports
          path: artifacts/
          if-no-files-found: warn
